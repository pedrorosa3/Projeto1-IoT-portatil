version: '3.8'

services:
  node-red:
    image: nodered/node-red:latest
    container_name: node-red
    environment:
      - TZ=Europe/Portugal
    ports:
      - 1880:1880
    networks:
      idc-net:
        ipv4_address: 172.100.10.15
    volumes:
      - ./data/node-red-data:/data
#      - ./data/mosquitto-data/certs:/certs
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    ports:
      - 1883:1883
      - 8883:8883
      - 9001:9001
    volumes:
      - ./data/mosquitto-data/config:/mosquitto/config
      - ./data/mosquitto-data/data:/mosquitto/data
      - ./data/mosquitto-data/log:/mosquitto/log
      - ./data/mosquitto-data/certs:/mosquitto/certs
    networks:
      idc-net:
        ipv4_address: 172.100.10.10
  web:
      build: ./data/app-data/
      container_name: app
      ports:
        - "8000:8000"
      networks:
          idc-net:
              ipv4_address: 172.100.10.14
  processor:
    build:
      context: ./processor
      dockerfile: Dockerfile
    container_name: processor-service
    depends_on:
      - mosquitto
      - db
    environment:
      MQTT_BROKER_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_TOPIC: "idc/iris"
      DB_HOST: mysql
      DB_USER: root
      DB_PASS: root
      DB_NAME: evcharging
    networks:
      idc-net:
        ipv4_address: 172.100.10.13
    volumes:
      - ./data/app-data/model:/model
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: evcharging
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d
    networks:
      idc-net:
        ipv4_address: 172.100.10.12
    restart: unless-stopped
  machine-learning:
    build: .
    container_name: ML
    ports:
      - "8888:8888"
    networks:
      idc-net:
        ipv4_address:  172.100.10.34
    volumes:
      - ./data:/home

networks:
  idc-net:
      driver: bridge
      ipam:
        driver: default
        config:
          - subnet: 172.100.10.0/24


volumes:
  mysql_data:
