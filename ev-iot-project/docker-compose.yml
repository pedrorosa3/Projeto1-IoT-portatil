version: '3.8'
services:
  processor:
    build: ./MQTTprocessor
    container_name: processor
    networks:
      - ev_network
    environment:
      - MQTT_BROKER_HOST=mqtt-broker
      - MQTT_BROKER_PORT=8883
      - DB_HOST=database
      - DB_USER=root
      - DB_PASSWORD=evdatasetpassword
      - DB_NAME=ev_charging_db
      - PYTHONUNBUFFERED=1
    volumes:
      - ./EVDataset:/app/data
      - ./Certificates:/app/certs
    depends_on:
      mqtt-broker:
        condition: service_started
      database:
        condition: service_started

  mqtt-broker:
    image: eclipse-mosquitto:latest
    container_name: mqtt-broker
    ports:
      - 1883:1883
      - 8883:8883
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
      - ./Certificates:/certs
    networks:
      - ev_network

  database:
    image: mysql:latest
    container_name: database
    environment:
      MYSQL_ROOT_PASSWORD: "evdatasetpassword"
      MYSQL_DATABASE: "ev_charging_db"
    ports:
      - 3306:3306
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ev_network

  dashboard:
    image: nodered/node-red:latest
    container_name: dashboard
    ports:
      - 1880:1880
    volumes:
      - ./node_red_data:/data
    networks:       
      - ev_network  

  ml-processor:
    build: ./MLprocessor
    container_name: ml-processor
    networks:
      - ev_network
    environment:
      - MQTT_BROKER_HOST=mqtt-broker
      - MQTT_BROKER_PORT=8883
      - DB_HOST=database
      - DB_USER=root
      - DB_PASSWORD=evdatasetpassword
      - DB_NAME=ev_charging_db
      - PYTHONUNBUFFERED=1
    volumes:
      - ./Certificates:/app/certs
    depends_on:
      mqtt-broker:
        condition: service_started
      database:
        condition: service_started

networks:
  ev_network:
    driver: bridge

volumes:
  mysql_data: